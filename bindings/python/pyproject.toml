[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rowl"
version = "0.0.0"
description = "Python bindings for ROWL, an OWL 2 reasoner whose answers are proved against the OWL 2 Direct Semantics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools]
packages = ["rowl"]

[tool.setuptools.package-data]
rowl = ["py.typed"]
